# ВАЖНО: замените ВАШ_ЛОГИН_GITHUB на ваш логин на GitHub.
# Если репозиторий называется не "teplograd", поменяйте и это.
backend:
  name: github
  repo: ВАШ_ЛОГИН_GITHUB/teplograd
  branch: main

locale: ru
site_url: https://teplograd.netlify.app
display_url: https://teplograd.netlify.app

# Куда загружаются картинки и как они подключаются на сайте
media_folder: "img"
public_folder: "/img"

collections:
  - name: catalog
    label: Каталог
    files:
      - name: products
        label: Товары
        file: products.json
        fields:
          - label: Товары
            name: products
            widget: list
            label_singular: товар
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.name}} — {{fields.price}} ₽"
            fields:
              - { label: Название, name: name, widget: string }
              - { label: "Цена, ₽", name: price, widget: number, value_type: int, min: 0 }
              - { label: В наличии, name: inStock, widget: boolean, default: true }
              - { label: Артикул, name: sku, widget: string, hint: "Должен быть уникальным. Например: 83607" }
              - label: Бренд
                name: brand
                widget: relation
                collection: settings
                file: site
                search_fields: ["brands.*.name"]
                value_field: "brands.*.name"
                display_fields: ["brands.*.name"]
                hint: "Список брендов редактируется в «Страницы и настройки»."
              - label: Раздел
                name: section
                widget: relation
                collection: settings
                file: site
                search_fields: ["categories.*.name"]
                value_field: "categories.*.name"
                display_fields: ["categories.*.name"]
                hint: "Список разделов редактируется в «Страницы и настройки»."
              - { label: "Мощность, кВт", name: power, widget: number, value_type: float, min: 0, required: false, hint: "Только для котлов, радиаторов, водонагревателей. Для остальных оставьте пустым." }
              - { label: Фото товара, name: image, widget: image, required: false, hint: "Если фото не загружено, на сайте будет значок." }
              - { label: Описание, name: description, widget: text, required: false, hint: "Если оставить пустым, на сайте будет автоматическое описание. Новый абзац — с новой строки." }
              - label: Характеристики
                name: specs
                widget: list
                required: false
                label_singular: характеристику
                hint: "Если список пуст, на сайте будут автоматические характеристики."
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Значение, name: value, widget: string }
              - label: Значок вместо фото
                name: icon
                widget: select
                required: false
                options:
                  - { label: Фитинг, value: fit }
                  - { label: Насос, value: pump }
                  - { label: Кран / клапан, value: valve }
                  - { label: Коллектор, value: coll }
                  - { label: Котёл / водонагреватель, value: boil }
                  - { label: Радиатор, value: rad }
                  - { label: Труба / подводка / дымоход, value: pipe }

  - name: settings
    label: Страницы и настройки
    files:
      - name: site
        label: Бренды, разделы, «О компании», «Контакты»
        file: site.json
        fields:
          - label: Бренды
            name: brands
            widget: list
            label_singular: бренд
            summary: "{{fields.name}}"
            hint: "Если переименовать бренд, у его товаров тоже нужно поменять бренд."
            fields:
              - { label: Название бренда, name: name, widget: string }
          - label: Разделы каталога
            name: categories
            widget: list
            label_singular: раздел
            summary: "{{fields.name}}"
            hint: "Если переименовать раздел, у его товаров тоже нужно поменять раздел."
            fields:
              - { label: Название раздела, name: name, widget: string }
              - { label: Показывать плиткой на главной, name: onHome, widget: boolean, default: true }
              - { label: Подпункты на плитке (каждый с новой строки), name: items, widget: text, required: false }
          - label: Страница «О компании»
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Текст (каждый абзац с новой строки), name: text, widget: text }
              - label: Цифры
                name: stats
                widget: list
                label_singular: цифру
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: Число, name: value, widget: string }
                  - { label: Подпись, name: label, widget: string }
              - label: Преимущества
                name: features
                widget: list
                label_singular: преимущество
                summary: "{{fields.title}}"
                fields:
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Текст, name: text, widget: text }
          - label: Страница «Контакты»
            name: contacts
            widget: object
            collapsed: true
            fields:
              - { label: Телефон (в шапке и на странице), name: phone, widget: string }
              - { label: Пояснение к телефону, name: phoneNote, widget: string, required: false }
              - { label: Электронная почта, name: email, widget: string }
              - { label: Пояснение к почте, name: emailNote, widget: string, required: false }
              - { label: Адрес, name: address, widget: string }
              - { label: Пояснение к адресу, name: addressNote, widget: string, required: false }
              - { label: Часы работы (в шапке и на странице), name: hours, widget: string }
              - { label: Пояснение к часам работы, name: hoursNote, widget: string, required: false }
